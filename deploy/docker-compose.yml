# ============================================================
# FILE: deploy/docker-compose.yml
# ============================================================
version: '3.8'

services:
  c2-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cyberai-c2
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "443:443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=24h
      - DB_PATH=/app/data/c2.db
      - WSS_MAX_PAYLOAD=1048576
      - DNS_DOMAIN=${DNS_DOMAIN:-tunnel.example.com}
      - DNS_RECORD_TTL=60
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    volumes:
      - c2-data:/app/data
      - c2-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - c2-network

  # Optional: Nginx reverse proxy for TLS termination
  nginx:
    image: nginx:alpine
    container_name: cyberai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - c2-server
    networks:
      - c2-network

volumes:
  c2-data:
  c2-logs:

networks:
  c2-network:
    driver: bridge
