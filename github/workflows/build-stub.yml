# ============================================================
# FILE: .github/workflows/build-stub.yml
# ============================================================
name: Build Stub APK

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'payload/stub/**'
      - '.github/workflows/build-stub.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'payload/stub/**'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Override package name (e.g., com.example.helper)'
        required: false
        default: ''
      app_name:
        description: 'Override app label (e.g., System Helper)'
        required: false
        default: ''

jobs:
  build-stub:
    name: Build & Sign Stub APK
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('payload/stub/**/*.gradle*', 'payload/stub/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Build Config
        id: config
        run: |
          PACKAGE="${{ github.event.inputs.package_name }}"
          if [ -z "$PACKAGE" ]; then
            PACKAGE="io.sys.helper.$(date +%s | md5sum | head -c12)"
          fi
          APP_NAME="${{ github.event.inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="System Helper"
          fi
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "build_timestamp=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Override Package & App Name
        working-directory: payload/stub
        run: |
          # Override package in build.gradle.kts
          sed -i "s/applicationId = \".*\"/applicationId = \"${{ steps.config.outputs.package }}\"/" app/build.gradle.kts
          # Override app label in strings.xml
          find . -name "strings.xml" -exec sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ steps.config.outputs.app_name }}</string>|" {} +

      - name: Build Stub APK
        working-directory: payload/stub
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Parch=${{ matrix.arch }} \
            -Pandroid.injected.sign.digestAlgorithms=SHA-256 \
            --no-daemon

      - name: Sign APK (if keystore provided)
        if: secrets.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          APK=$(find payload/stub/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            java -jar /usr/local/lib/android/sdk/build-tools/*/apksigner sign \
              --ks /tmp/keystore.jks \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "${APK%.apk}-signed.apk" \
              "$APK"
            echo "signed_apk=${APK%.apk}-signed.apk" >> $GITHUB_ENV
          fi

      - name: Upload Stub APK
        uses: actions/upload-artifact@v4
        with:
          name: stub-apk-${{ matrix.arch }}-${{ steps.config.outputs.build_timestamp }}
          path: |
            payload/stub/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Generate Build Report
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Package: ${{ steps.config.outputs.package }}" >> $GITHUB_STEP_SUMMARY
          echo "- App Name: ${{ steps.config.outputs.app_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: ${{ steps.config.outputs.build_timestamp }}" >> $GITHUB_STEP_SUMMARY
          APK_SIZE=$(find payload/stub/app/build/outputs/apk/release -name "*.apk" -exec du -h {} \; 2>/dev/null | head -1)
          if [ -n "$APK_SIZE" ]; then echo "- $APK_SIZE" >> $GITHUB_STEP_SUMMARY; fi

  # Build and sign the full module DEX for OTA delivery
  build-module:
    name: Build DEX Module
    runs-on: ubuntu-24.04
    needs: build-stub
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Module to DEX
        run: |
          mkdir -p build/module
          # Compile all Java files in payload/module
          find payload/module/src -name "*.java" > build/module/sources.txt
          javac \
            -d build/module/classes \
            -source 11 -target 11 \
            -cp $ANDROID_HOME/platforms/android-34/android.jar \
            @build/module/sources.txt

          # Convert to DEX using d8
          $ANDROID_HOME/build-tools/*/d8 \
            --lib $ANDROID_HOME/platforms/android-34/android.jar \
            --output build/module/ \
            build/module/classes

          # Encrypt DEX for OTA delivery
          if [ -f build/module/classes.dex ]; then
            # Generate encryption key from device seed
            echo "Module DEX built: $(wc -c < build/module/classes.dex) bytes"
            cp build/module/classes.dex build/module/payload.dex
          fi

      - name: Upload Module DEX
        uses: actions/upload-artifact@v4
        with:
          name: module-payload
          path: build/module/payload.dex
          retention-days: 30
