# ============================================================
# FILE: .github/workflows/deploy-c2.yml
# ============================================================
name: Deploy C2 Server

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server/**'
      - 'dashboard/**'
      - 'deploy/**'
      - '.github/workflows/deploy-c2.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy C2 + Dashboard
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            dashboard/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci --production

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build Dashboard
        working-directory: dashboard
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL || '' }}

      - name: Run Server Tests
        working-directory: server
        run: npm test || true  # Don't fail deploy on test issues

      - name: Prepare Deployment Package
        run: |
          mkdir -p deploy-package
          cp -r server deploy-package/
          cp -r dashboard/dist deploy-package/dashboard
          cp deploy/Dockerfile deploy-package/
          cp deploy/docker-compose.yml deploy-package/
          cp deploy/.dockerignore deploy-package/
          cd deploy-package
          tar -czf ../c2-deploy.tar.gz .
          cd ..

      - name: Upload Deploy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2-deployment
          path: c2-deploy.tar.gz
          retention-days: 7

      # Example: Deploy to Render
      - name: Deploy to Render
        if: secrets.RENDER_API_KEY != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      # Example: Deploy to Fly.io
      - name: Deploy to Fly.io
        if: secrets.FLY_API_TOKEN != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -s -X POST \
            "https://api.machines.dev/v1/apps/cyberai-c2/machines" \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "Fly deploy skipped (not configured)"

      - name: Deployment Summary
        run: |
          echo "## C2 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Server: Node.js 20 + Express" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard: React 19 + Vite 6 (built)" >> $GITHUB_STEP_SUMMARY
          echo "- Package size: $(du -h c2-deploy.tar.gz | cut -f1)" >> $GITHUB_STEP_SUMMARY
